<title>Davetiye — Studio SEOZ</title>
<link rel="stylesheet" href="css/canvas.css">
<style>
  html, body{ margin:0; min-height:100vh; background:#E9E4D8; }
  /* EK MADDE DÜZELTMESİ — ZEMİN PNG YÜKSEKLİK/BOŞLUK SORUNU:
     Bu sınıf yalnızca YAYIN sayfasında kullanılır (editörün kendi
     önizleme paneli hâlâ paylaşılan .seoz-canvas-outer'ı olduğu gibi
     kullanır, buradan etkilenmez). Dış sarmalayıcı her zaman EN AZ
     ekran yüksekliği kadar tutulur — davetiye içeriği kısa olsa bile
     altında/üstünde "boşta" kalan, hiçbir şeyin kaplamadığı bir alan
     OLUŞMAZ; o alan her zaman bu sabit, hemen hazır (asenkron
     beklemeyen) nötr renkle dolu kalır. 100dvh, mobil tarayıcılarda
     adres çubuğu görünür/gizlenirken 100vh'nin verdiği yanlış
     (fazla/eksik) yükseklik sorununu düzeltir — destekleyen
     tarayıcılarda 100vh'nin üzerine yazar, desteklemeyenlerde
     sessizce yok sayılır. */
  .seoz-view-outer{ min-height:100vh; min-height:100dvh; }
  .view-message{
    min-height: 100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding: 24px; font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem; color:#5C5A4E;
  }
</style>
